name: Aswenna Marketplace CI/CD Pipeline

on:
  push:
    branches: [ "main", "development", "feature", "testing", "deployment" ]
  pull_request:
    branches: [ "main", "development" ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Laravel Backend Integration & Automated Testing
  # -------------------------------------------------------------
  backend-ci:
    name: Backend CI (Laravel PHP 8.2)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, json, gd
          coverage: none

      - name: Copy Environment Configuration
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate Application Encryption Key
        run: php artisan key:generate

      - name: Run Database Migrations (In-Memory SQLite)
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: php artisan migrate --force

      - name: Execute Backend Test Suite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: php artisan test

  # -------------------------------------------------------------
  # Job 2: Flutter Frontend Static Analysis & Verification
  # -------------------------------------------------------------
  frontend-ci:
    name: Frontend CI (Flutter)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Java Environment
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Analyze Flutter Code Quality
        run: flutter analyze --no-fatal-infos

  # -------------------------------------------------------------
  # Job 3: AI Microservice Syntax & Health Check
  # -------------------------------------------------------------
  ai-service-ci:
    name: AI Service CI (Python 3.10)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai_models

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Verify Python Script Compilation
        run: |
          python -m py_compile chatbot_service.py
